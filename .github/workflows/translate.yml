name: Translate & Sync to Main

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Translate all source files missing an English translation'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: i18n-sync
  cancel-in-progress: false

jobs:
  translate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Translate changed files
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -x
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill }}" = "true" ]; then
            node scripts/translate.mjs --backfill --out translate-summary.json
          else
            node scripts/translate.mjs --out translate-summary.json
          fi

      - name: Show summary
        if: always()
        run: |
          if [ -f translate-summary.json ]; then
            echo "=== Translation summary ==="
            cat translate-summary.json
          fi

      - name: Sync to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ALL changes (source edits + deletions + AI translations)
          git add .

          if git diff --cached --quiet; then
            echo "No changes — done."
            exit 0
          fi

          git commit -m "chore: sync dev → main"
          DEV_SHA=$(git rev-parse HEAD)

          # Create sync branch from main to guarantee fast-forward
          git fetch origin main
          git checkout -B sync/i18n origin/main

          # Remove everything first, then apply dev's tree (handles deletions)
          git rm -rf --quiet . 2>/dev/null || true
          git checkout "$DEV_SHA" -- .
          git commit -m "chore: sync dev → main"

          echo "=== Pushing to main ==="
          git push origin HEAD:main
          echo "✓ Done"
