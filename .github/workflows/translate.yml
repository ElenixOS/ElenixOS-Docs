name: Translate docs & blog to English

on:
  push:
    branches-ignore: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'scripts/**'
      - '.github/workflows/translate.yml'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Translate all source files missing an English translation'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: i18n-en-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Translate changed files
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -x
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill }}" = "true" ]; then
            node scripts/translate.mjs --backfill --out translate-summary.json
          else
            node scripts/translate.mjs --out translate-summary.json
          fi

      - name: Show summary
        if: always()
        run: |
          if [ -f translate-summary.json ]; then
            echo "=== Translation summary ==="
            cat translate-summary.json
          fi

      - name: Push translations to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== i18n status ==="
          git status --short i18n/ 2>&1 || true

          git add i18n/

          if git diff --cached --quiet; then
            echo "No i18n changes — done."
            exit 0
          fi

          echo "=== Committing i18n ==="
          git diff --cached --name-only
          git commit -m "chore(i18n): AI translate docs/blog changes [skip ci]"
          I18N_SHA=$(git rev-parse HEAD)

          echo "=== Applying to main ==="
          git fetch origin main
          git checkout -B ci-i18n origin/main
          git checkout "$I18N_SHA" -- i18n/
          git commit -m "chore(i18n): AI translate docs/blog changes [skip ci]"

          echo "=== Pushing to main ==="
          git push origin HEAD:main
          echo "✓ Done"
