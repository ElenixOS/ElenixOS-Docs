name: Translate docs & blog to English

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Translate all source files missing an English translation'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: i18n-sync
  cancel-in-progress: false

jobs:
  translate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Translate changed files
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -x
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill }}" = "true" ]; then
            node scripts/translate.mjs --backfill --out translate-summary.json
          else
            node scripts/translate.mjs --out translate-summary.json
          fi

      - name: Show summary
        if: always()
        run: |
          if [ -f translate-summary.json ]; then
            echo "=== Translation summary ==="
            cat translate-summary.json
          fi

      - name: Sync to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit all changes (dev source + AI translations) to an intermediate branch
          SYNC_BRANCH="sync/i18n-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$SYNC_BRANCH"
          git add docs/ blog/ i18n/
          git commit -m "chore(i18n): AI translate docs/blog changes" || {
            echo "No changes to sync."
            exit 0
          }

          echo "=== Pushing $SYNC_BRANCH → main ==="
          git push origin "$SYNC_BRANCH:main"
          echo "✓ Synced to main"

          # Clean up intermediate branch
          git push origin --delete "$SYNC_BRANCH" 2>/dev/null || true
